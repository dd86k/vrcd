<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#16161c">
<title>vrcd</title>
<link rel="stylesheet" href="/static/app.css">
</head>
<body>

<!-- Icons are inlined rather than fetched: the rail is the first thing drawn,
     and a sprite request would be one more round trip before it reads right. -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
<defs>
<g id="i-feed" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
    <path d="M4 7h16M4 12h11M4 17h14"/></g>
<g id="i-online" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
    <circle cx="9" cy="9" r="3"/><path d="M3.5 19a5.5 5.5 0 0 1 11 0"/>
    <circle cx="17" cy="9.5" r="2.2"/><path d="M15 19a4 4 0 0 1 5.8-3.2"/></g>
<g id="i-inbox" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round">
    <rect x="3" y="6" width="18" height="12" rx="2"/><path d="M3.5 7.5L12 13l8.5-5.5"/></g>
<g id="i-stuff" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round">
    <rect x="4" y="4" width="7" height="7" rx="1.5"/><rect x="13" y="4" width="7" height="7" rx="1.5"/>
    <rect x="4" y="13" width="7" height="7" rx="1.5"/><rect x="13" y="13" width="7" height="7" rx="1.5"/></g>
<g id="i-tools" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
    <path d="M4 7h8M18 7h2M4 17h2M12 17h8"/><circle cx="15" cy="7" r="2.2"/><circle cx="9" cy="17" r="2.2"/></g>
<g id="i-profile" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
    <circle cx="12" cy="8.5" r="3.5"/><path d="M4.5 20a7.5 7.5 0 0 1 15 0"/></g>
<g id="i-back" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M15 5l-7 7 7 7"/></g>
</defs>
</svg>

<div id="shell" class="shell" data-pane="list">

    <nav class="rail" id="rail"></nav>

    <section class="list">
        <!-- The heading is for screen readers and the document outline only:
             the rail (or the bottom bar) already says which tab is open. -->
        <h1 id="listTitle" class="sr-only">Online</h1>
        <div class="pane-head" id="listHead">
            <input id="search" class="search" type="search" placeholder="Filter...">
        </div>
        <div id="listBody" class="pane-body"></div>
    </section>

    <aside class="detail">
        <div class="pane-head">
            <button class="back" onclick="showList()" aria-label="Back">
                <svg width="22" height="22"><use href="#i-back"/></svg>
            </button>
            <h2 id="detailTitle">Details</h2>
        </div>
        <div id="detailBody" class="detail-body"></div>
    </aside>

    <nav class="bottom" id="bottom"></nav>
</div>

<div id="toast" class="toast hidden" role="status" aria-live="polite"></div>
<script src="/static/app.js"></script>
</body>
</html>
