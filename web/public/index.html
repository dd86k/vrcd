<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#16161c">
<title>vrcd</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/static/icon-512.png">
<!-- iOS ignores the manifest: standalone mode, the home screen icon, and the
     status bar all come from these instead. Translucent because the shell
     already paints its own background under the notch (viewport-fit=cover). -->
<link rel="apple-touch-icon" href="/static/icon-512.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="vrcd">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="/static/app.css">
</head>
<body>

<!-- Icons are inlined rather than fetched: the rail is the first thing drawn,
     and a sprite request would be one more round trip before it reads right. -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
<defs>
<!-- symbol, not g: the viewBox is what maps the 24-unit artwork onto whatever
     width/height the <use> site asks for. A plain <g> renders 1 unit per pixel
     and clips the last few units off the right and bottom. -->
<symbol id="i-feed" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
    <path d="M4 7h16M4 12h11M4 17h14"/></symbol>
<symbol id="i-online" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
    <circle cx="9" cy="9" r="3"/><path d="M3.5 19a5.5 5.5 0 0 1 11 0"/>
    <circle cx="17" cy="9.5" r="2.2"/><path d="M15 19a4 4 0 0 1 5.8-3.2"/></symbol>
<symbol id="i-inbox" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round">
    <rect x="3" y="6" width="18" height="12" rx="2"/><path d="M3.5 7.5L12 13l8.5-5.5"/></symbol>
<symbol id="i-stuff" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round">
    <rect x="4" y="4" width="7" height="7" rx="1.5"/><rect x="13" y="4" width="7" height="7" rx="1.5"/>
    <rect x="4" y="13" width="7" height="7" rx="1.5"/><rect x="13" y="13" width="7" height="7" rx="1.5"/></symbol>
<symbol id="i-tools" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
    <path d="M4 7h8M18 7h2M4 17h2M12 17h8"/><circle cx="15" cy="7" r="2.2"/><circle cx="9" cy="17" r="2.2"/></symbol>
<symbol id="i-profile" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
    <circle cx="12" cy="8.5" r="3.5"/><path d="M4.5 20a7.5 7.5 0 0 1 15 0"/></symbol>
<symbol id="i-back" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M15 5l-7 7 7 7"/></symbol>
</defs>
</svg>

<div id="shell" class="shell" data-pane="list">

    <nav class="rail" id="rail"></nav>

    <section class="list">
        <!-- The heading is for screen readers and the document outline only:
             the rail (or the bottom bar) already says which tab is open. -->
        <h1 id="listTitle" class="sr-only">Online</h1>
        <div class="pane-head" id="listHead">
            <input id="search" class="search" type="search" placeholder="Filter...">
        </div>
        <div id="listBody" class="pane-body"></div>
    </section>

    <aside class="detail">
        <div class="pane-head">
            <button class="back" onclick="showList()" aria-label="Back">
                <svg width="22" height="22"><use href="#i-back"/></svg>
            </button>
            <h2 id="detailTitle">Details</h2>
        </div>
        <div id="detailBody" class="detail-body"></div>
    </aside>

    <nav class="bottom" id="bottom"></nav>
</div>

<!-- Filled in by app.js when vrcd-server asks a front-end to sign it in to
     VRChat. Empty and hidden the rest of the time. -->
<div id="signin" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="signinTitle"></div>

<!-- The crop frame, raised by a picked or dropped picture and torn down when
     it is uploaded or cancelled. -->
<div id="crop" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="cropTitle"></div>

<!-- Shown only while a file is being dragged over the window, and it must not
     take pointer events: a target that swallows the drop it is advertising
     would let the browser navigate to the file instead. -->
<div id="drop" class="drop hidden" aria-hidden="true"></div>

<div id="toast" class="toast hidden" role="status" aria-live="polite"></div>
<script src="/static/app.js"></script>
</body>
</html>
