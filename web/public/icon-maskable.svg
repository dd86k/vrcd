<!-- Maskable variant of icon-512.png: Android crops an adaptive icon to
     whatever shape the launcher uses, so the artwork sits at 56% inside the
     safe circle on the app background instead of running to the edges. The
     PNG is inlined because an SVG loaded as an image cannot fetch anything. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
<rect width="512" height="512" fill="#16161c"/>
<image x="112" y="112" width="288" height="288" href="data:image/png;base64,"/>
</svg>
